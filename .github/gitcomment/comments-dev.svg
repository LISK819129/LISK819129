<svg xmlns="http://www.w3.org/2000/svg" width="880" height="166" viewBox="0 0 880 166" role="img" aria-label="Comments">
<style>
.t { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 15px; fill: #1a7f37; }
.u { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13.5px; font-weight: 600; fill: #1a7f37; }
.m { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; fill: #1f2328; }
.d { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11.5px; fill: #8b949e; }
.dim { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12.5px; fill: #9aa4b0; }
.art { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; fill: #1a7f37; opacity: 0.85; }
</style>
<rect x="1" y="1" width="878" height="164" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<circle cx="26" cy="30" r="5.5" fill="#ff5f57"/>
<circle cx="44" cy="30" r="5.5" fill="#febc2e"/>
<circle cx="62" cy="30" r="5.5" fill="#28c840"/>
<text x="82" y="35" class="t">Comments</text>
<text x="60" y="98" class="dim">// nothing here yet — be the first.</text>
<text x="60" y="148" class="u">_<tspan fill="#1a7f37">█</tspan></text>
<text x="596" y="48" class="dim">// little messages from</text>
<text x="596" y="66" class="dim">// people passing by.</text>
<text x="596" y="84" class="dim">// keep building.</text>
<text x="806" y="42" class="art" xml:space="preserve">/\__/\</text>
<text x="806" y="56" class="art" xml:space="preserve">( •_• )</text>
<text x="806" y="70" class="art" xml:space="preserve">  \|</text>
<text x="806" y="84" class="art" xml:space="preserve">   |</text>
<text x="806" y="98" class="art" xml:space="preserve">  |_|_,</text>
</svg>